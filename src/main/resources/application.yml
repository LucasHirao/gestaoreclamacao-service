spring:
  application:
    name: gestao-reclamacoes
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      endpoint: ${AWS_ENDPOINT_URL:}
      sqs:
        queue-not-found-strategy: FAIL
        listener:
          poll-timeout: 5s
      dynamodb:
        enabled: false
      sns:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  sla:
    parametros: classpath:parametros/sla-parametros.json
  classification:
    regras: classpath:classificacao/regras-classificacao.json
    sinonimos: classpath:classificacao/sinonimos-classificacao.json
  observability:
    log-json: false

aws:
  account-id-local: ${AWS_ACCOUNT_ID_LOCAL:000000000000}
  bdd:
    dynamodb-table: ${BDD_DYNAMO_TABLE:bdd-fronteira-sanidade}
    sns-topic-arn: ${BDD_SNS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:integracao-eventos}
  sqs:
    standardized-request-queue: ${SQS_SOLICITACAO_PADRONIZADA:}
    integracao-queue: ${SQS_INTEGRACAO:}
    sla-verification-queue: ${SQS_SLA_VERIFICACAO:}
    poll-interval-ms: ${AWS_SQS_POLL_MS:2500}

logging:
  level:
    com.banco.reclamacoes: INFO
